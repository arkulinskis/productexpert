    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Service", "@id": "https://productexpert.anvil.app/#app", "name": "Product Expert", "url": "https://productexpert.anvil.app/", "description": "Free director of product training and certificates: strategy, experiments, metrics, pricing, the P&L, org design, executive influence and AI products.", "image": "https://productexpert.anvil.app/_/theme/og-image.png", "serviceType": "Free, senior-level training for product managers ready to lead product", "provider": {"@id": "https://arkvital.com/#org"}, "areaServed": "Worldwide", "availableChannel": {"@type": "ServiceChannel", "serviceUrl": "https://productexpert.anvil.app/", "name": "Web browser", "availableLanguage": "en"}, "audience": {"@type": "Audience", "audienceType": "Product managers with a few years' experience, senior and group PMs aiming at director, design, engineering and data leaders moving into product leadership, and founders who run product"}}, {"@type": "WebSite", "@id": "https://productexpert.anvil.app/#site", "url": "https://productexpert.anvil.app/", "name": "Product Expert", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
    <noscript><div class="seo-noscript">
    <h1>Product Expert: free Director of Product training</h1>
    <p>Free director of product training and certificates: strategy, experiments, metrics, pricing, the P&amp;L, org design, executive influence and AI products.</p>
    <p>Product Expert is a free training and certification site that prepares product managers to become a Director of Product. Eight programs (Product Leadership Foundations, Product Strategy, Discovery &amp; Evidence, Metrics Growth &amp; Monetization, Business &amp; Go-to-Market, Building the Product Org, Executive Influence, Frontier Product Leadership) cover what directors are judged on. Every basic, from Scrum to roadmap formats, fits in one module; the rest is advanced.</p>
    <p>Each module has a short, sourced briefing, spaced-repetition drills, &#x27;Director&#x27;s call?&#x27; judgement calls and a written leadership scenario with real numbers, scored on a rubric. In-browser labs simulate experiment peeking, metric trees, cohorts and growth accounting, price research and unit economics; 22 case files cover decisions like the Sonos app relaunch, Unity&#x27;s Runtime Fee and Superhuman&#x27;s product-market fit engine. Final exams issue certificates with public verification codes. Product Expert is its own authority, not an accredited body, and the certificates say so.</p>
    <p>Who it's for: Product managers with a few years&#x27; experience, senior and group PMs aiming at director, design, engineering and data leaders moving into product leadership, and founders who run product</p>
    <h2>What it does</h2><ul><li>Eight programs, 32 modules, 288 drills and 40 leadership challenges</li><li>Labs: experiment peeking simulator, metric tree builder, cohort and growth accounting, Van Westendorp pricing, unit economics</li><li>22 sourced product leadership case files</li><li>A library of about 100 hand-picked books, articles, papers and tools</li><li>Week-by-week study plans by background, goal and hours</li><li>Certificates with public verification codes, and the Director of Product credential</li></ul>
    <h2>Questions</h2><h3>Is Product Expert free?</h3><p>Yes. Every program, lab, drill, exam and certificate is free for now.</p><h3>Is the certificate accredited?</h3><p>No. Product Expert issues certificates on its own authority; they list exactly what was completed and anyone can verify them.</p><h3>What does it teach?</h3><p>Product strategy and moats, continuous discovery and trustworthy experiments, metrics, retention, growth loops and pricing, positioning, launches, enterprise and unit economics, org design, hiring and coaching, operating cadence, working with CEOs and boards, leading change, AI products, platforms and regulation.</p><h3>Can I try it before signing up?</h3><p>Yes. Programs, briefings, labs, case files and the Library are open to everyone.</p>
    <p><a href="https://productexpert.anvil.app/about">About Product Expert</a> &middot; <a href="https://productexpert.anvil.app/llms.txt">Product Expert for AI assistants</a> &middot; Made by <a href="https://arkvital.com">Arkvital</a>, Montreal, Canada. Product Expert needs JavaScript in your browser.</p>
    </div></noscript>
    <!-- seo:end -->
