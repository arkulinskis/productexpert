<div class="lib-row-host">
  <article class="lib-row" anvil:dom-node="box">
    <div class="lib-tags">
      <span class="ui-badge" anvil:dom-node="kind"></span>
      <span class="ui-badge" anvil:dom-node="cost"></span>
      <span class="ui-badge brand" anvil:dom-node="start" hidden>Start here</span>
    </div>
    <h3><a anvil:dom-node="link" target="_blank" rel="noopener"></a></h3>
    <p class="by" anvil:dom-node="by"></p>
    <p class="why" anvil:dom-node="why"></p>
    <div class="lib-act" anvil:name="act_box">
      <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-sm", "btn-ghost", "ic-bookmark"]'></anvil-component>
    </div>
  </article>
</div>
