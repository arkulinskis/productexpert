<div class="sd-card">
  <div class="sd-card-head"><span class="small muted" anvil:dom-node="label"></span>
    <anvil-component type="Button" name="remove_button" prop:text="" prop:tooltip="Remove this bet" prop:role='["btn", "btn-ghost", "btn-icon", "btn-sm", "ic-x"]'></anvil-component>
  </div>
  <label class="ui-field"><span>Problem</span><anvil-component type="TextArea" name="problem_box" prop:placeholder="Whose problem, and how bad is it?" prop:role='["sd-ta-sm"]'></anvil-component></label>
  <label class="ui-field"><span>Bet</span><anvil-component type="TextArea" name="bet_box" prop:placeholder="What you'll try" prop:role='["sd-ta-sm"]'></anvil-component></label>
  <label class="ui-field"><span>Evidence</span><anvil-component type="TextArea" name="evidence_box" prop:placeholder="What makes it worth the team's time?" prop:role='["sd-ta-sm"]'></anvil-component></label>
  <label class="ui-field"><span>Measure</span><anvil-component type="TextArea" name="measure_box" prop:placeholder="What changes if it works?" prop:role='["sd-ta-sm"]'></anvil-component></label>
</div>
